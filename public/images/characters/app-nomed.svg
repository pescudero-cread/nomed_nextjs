<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- App Nomed - Robot Inteligente -->
  <defs>
    <linearGradient id="app-nomed-blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003A8F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#013763;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="app-nomed-cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#019EE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="app-nomed-brown-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6F4B24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A2C17;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cuerpo principal del robot -->
  <rect x="70" y="100" width="60" height="80" rx="10" fill="url(#app-nomed-blue-gradient)" class="app-nomed-character"/>
  
  <!-- Cabeza -->
  <rect x="75" y="60" width="50" height="40" rx="8" fill="url(#app-nomed-blue-gradient)"/>
  
  <!-- Pantalla LED -->
  <rect x="80" y="70" width="40" height="20" rx="4" fill="url(#app-nomed-cyan-gradient)" class="app-nomed-screen"/>
  
  <!-- Contenido de la pantalla -->
  <rect x="85" y="75" width="8" height="2" fill="white" opacity="0.8"/>
  <rect x="95" y="75" width="8" height="2" fill="white" opacity="0.8"/>
  <rect x="105" y="75" width="8" height="2" fill="white" opacity="0.8"/>
  <rect x="85" y="80" width="12" height="2" fill="white" opacity="0.6"/>
  <rect x="100" y="80" width="8" height="2" fill="white" opacity="0.6"/>
  <rect x="85" y="85" width="6" height="2" fill="white" opacity="0.4"/>
  <rect x="95" y="85" width="6" height="2" fill="white" opacity="0.4"/>
  <rect x="105" y="85" width="6" height="2" fill="white" opacity="0.4"/>
  
  <!-- Antena -->
  <line x1="100" y1="60" x2="100" y2="40" stroke="url(#app-nomed-blue-gradient)" stroke-width="3" stroke-linecap="round" class="app-nomed-antenna"/>
  <circle cx="100" cy="40" r="4" fill="url(#app-nomed-cyan-gradient)"/>
  
  <!-- Ojos LED -->
  <circle cx="90" cy="50" r="3" fill="url(#app-nomed-cyan-gradient)" class="app-nomed-screen"/>
  <circle cx="110" cy="50" r="3" fill="url(#app-nomed-cyan-gradient)" class="app-nomed-screen"/>
  
  <!-- Brazos -->
  <rect x="60" y="110" width="15" height="40" rx="7" fill="url(#app-nomed-blue-gradient)"/>
  <rect x="125" y="110" width="15" height="40" rx="7" fill="url(#app-nomed-blue-gradient)"/>
  
  <!-- Manos/Manipuladores -->
  <rect x="55" y="140" width="20" height="15" rx="3" fill="url(#app-nomed-blue-gradient)"/>
  <rect x="125" y="140" width="20" height="15" rx="3" fill="url(#app-nomed-blue-gradient)"/>
  
  <!-- Patas -->
  <rect x="75" y="180" width="20" height="15" rx="5" fill="url(#app-nomed-blue-gradient)"/>
  <rect x="105" y="180" width="20" height="15" rx="5" fill="url(#app-nomed-blue-gradient)"/>
  
  <!-- Iconos de app flotantes -->
  <g class="app-nomed-icons">
    <rect x="40" y="50" width="15" height="15" rx="3" fill="url(#app-nomed-cyan-gradient)" opacity="0.8"/>
    <rect x="42" y="52" width="11" height="2" fill="white"/>
    <rect x="42" y="55" width="8" height="2" fill="white"/>
    <rect x="42" y="58" width="10" height="2" fill="white"/>
  </g>
  
  <g class="app-nomed-icons">
    <rect x="145" y="60" width="15" height="15" rx="3" fill="url(#app-nomed-cyan-gradient)" opacity="0.8"/>
    <circle cx="152" cy="67" r="3" fill="white"/>
    <rect x="149" y="70" width="6" height="2" fill="white"/>
  </g>
  
  <g class="app-nomed-icons">
    <rect x="30" y="120" width="15" height="15" rx="3" fill="url(#app-nomed-cyan-gradient)" opacity="0.8"/>
    <rect x="32" y="122" width="11" height="2" fill="white"/>
    <rect x="32" y="125" width="8" height="2" fill="white"/>
    <rect x="32" y="128" width="9" height="2" fill="white"/>
    <rect x="32" y="131" width="7" height="2" fill="white"/>
  </g>
  
  <g class="app-nomed-icons">
    <rect x="155" y="130" width="15" height="15" rx="3" fill="url(#app-nomed-cyan-gradient)" opacity="0.8"/>
    <rect x="157" y="132" width="11" height="2" fill="white"/>
    <rect x="157" y="135" width="9" height="2" fill="white"/>
    <rect x="157" y="138" width="10" height="2" fill="white"/>
    <rect x="157" y="141" width="8" height="2" fill="white"/>
  </g>
  
  <!-- Efectos de brillo -->
  <circle cx="100" cy="80" r="30" fill="none" stroke="#019EE6" stroke-width="2" opacity="0.3" class="glow-effect"/>
</svg>
