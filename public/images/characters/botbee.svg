<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Botbee - Abeja Educativa -->
  <defs>
    <linearGradient id="botbee-honey-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D0A127;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#916610;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="botbee-tech-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#009DE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cuerpo principal -->
  <ellipse cx="100" cy="120" rx="45" ry="35" fill="url(#botbee-honey-gradient)" class="botbee-character"/>
  
  <!-- Rayas del cuerpo -->
  <rect x="70" y="100" width="60" height="8" fill="#916610" rx="4"/>
  <rect x="70" y="115" width="60" height="8" fill="#916610" rx="4"/>
  <rect x="70" y="130" width="60" height="8" fill="#916610" rx="4"/>
  
  <!-- Cabeza -->
  <circle cx="100" cy="80" r="30" fill="url(#botbee-honey-gradient)"/>
  
  <!-- Ojos tech azules -->
  <circle cx="90" cy="75" r="8" fill="url(#botbee-tech-gradient)" class="botbee-eyes"/>
  <circle cx="110" cy="75" r="8" fill="url(#botbee-tech-gradient)" class="botbee-eyes"/>
  <circle cx="90" cy="75" r="4" fill="white"/>
  <circle cx="110" cy="75" r="4" fill="white"/>
  
  <!-- Antenas -->
  <line x1="85" y1="55" x2="80" y2="45" stroke="#916610" stroke-width="3" stroke-linecap="round" class="botbee-antennae"/>
  <line x1="115" y1="55" x2="120" y2="45" stroke="#916610" stroke-width="3" stroke-linecap="round" class="botbee-antennae"/>
  <circle cx="80" cy="45" r="3" fill="#DAAE49"/>
  <circle cx="120" cy="45" r="3" fill="#DAAE49"/>
  
  <!-- Alas -->
  <ellipse cx="70" cy="100" rx="25" ry="15" fill="#DAAE49" opacity="0.8" class="botbee-wings"/>
  <ellipse cx="130" cy="100" rx="25" ry="15" fill="#DAAE49" opacity="0.8" class="botbee-wings"/>
  
  <!-- Patas -->
  <line x1="85" y1="155" x2="80" y2="170" stroke="#916610" stroke-width="4" stroke-linecap="round"/>
  <line x1="115" y1="155" x2="120" y2="170" stroke="#916610" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Sonrisa -->
  <path d="M 85 90 Q 100 100 115 90" stroke="#916610" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Efectos de brillo -->
  <circle cx="100" cy="80" r="35" fill="none" stroke="#DAAE49" stroke-width="2" opacity="0.3" class="glow-effect"/>
</svg>
