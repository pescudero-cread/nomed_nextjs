<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Monkit - Mono Constructor -->
  <defs>
    <linearGradient id="monkit-orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A54817;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#943C0F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="monkit-brown-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B5724D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="monkit-petrol-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E232F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A3441;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cuerpo principal -->
  <ellipse cx="100" cy="130" rx="50" ry="40" fill="url(#monkit-orange-gradient)" class="monkit-character"/>
  
  <!-- Cabeza -->
  <circle cx="100" cy="80" r="35" fill="url(#monkit-orange-gradient)"/>
  
  <!-- Orejas -->
  <circle cx="75" cy="60" r="12" fill="url(#monkit-orange-gradient)"/>
  <circle cx="125" cy="60" r="12" fill="url(#monkit-orange-gradient)"/>
  <circle cx="75" cy="60" r="6" fill="#943C0F"/>
  <circle cx="125" cy="60" r="6" fill="#943C0F"/>
  
  <!-- Ojos -->
  <circle cx="90" cy="75" r="6" fill="white"/>
  <circle cx="110" cy="75" r="6" fill="white"/>
  <circle cx="90" cy="75" r="3" fill="black" class="monkit-eyes"/>
  <circle cx="110" cy="75" r="3" fill="black" class="monkit-eyes"/>
  
  <!-- Nariz -->
  <ellipse cx="100" cy="85" rx="3" ry="2" fill="black"/>
  
  <!-- Boca -->
  <path d="M 90 95 Q 100 105 110 95" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Cinturón de herramientas -->
  <rect x="60" y="120" width="80" height="15" fill="url(#monkit-petrol-gradient)" rx="7"/>
  <rect x="60" y="120" width="80" height="5" fill="#1E232F"/>
  
  <!-- Llave inglesa en el cinturón -->
  <g class="monkit-tools">
    <rect x="85" y="125" width="8" height="3" fill="#B5724D"/>
    <rect x="87" y="123" width="4" height="7" fill="#B5724D"/>
    <circle cx="89" cy="126" r="2" fill="none" stroke="#1E232F" stroke-width="1"/>
  </g>
  
  <!-- Engranajes flotantes -->
  <g class="monkit-gears">
    <circle cx="50" cy="50" r="8" fill="none" stroke="#A54817" stroke-width="2"/>
    <circle cx="50" cy="50" r="4" fill="#A54817"/>
    <line x1="50" y1="42" x2="50" y2="58" stroke="#A54817" stroke-width="2"/>
    <line x1="42" y1="50" x2="58" y2="50" stroke="#A54817" stroke-width="2"/>
  </g>
  
  <g class="monkit-gears">
    <circle cx="150" cy="60" r="6" fill="none" stroke="#A54817" stroke-width="2"/>
    <circle cx="150" cy="60" r="3" fill="#A54817"/>
    <line x1="150" y1="54" x2="150" y2="66" stroke="#A54817" stroke-width="2"/>
    <line x1="144" y1="60" x2="156" y2="60" stroke="#A54817" stroke-width="2"/>
  </g>
  
  <!-- Brazos -->
  <ellipse cx="60" cy="110" rx="15" ry="25" fill="url(#monkit-orange-gradient)" transform="rotate(-20 60 110)"/>
  <ellipse cx="140" cy="110" rx="15" ry="25" fill="url(#monkit-orange-gradient)" transform="rotate(20 140 110)"/>
  
  <!-- Manos -->
  <circle cx="50" cy="130" r="8" fill="url(#monkit-brown-gradient)"/>
  <circle cx="150" cy="130" r="8" fill="url(#monkit-brown-gradient)"/>
  
  <!-- Patas -->
  <ellipse cx="85" cy="170" rx="12" ry="20" fill="url(#monkit-orange-gradient)"/>
  <ellipse cx="115" cy="170" rx="12" ry="20" fill="url(#monkit-orange-gradient)"/>
  
  <!-- Cola -->
  <path d="M 50 130 Q 30 120 20 140 Q 30 160 50 150" stroke="url(#monkit-orange-gradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Efectos de brillo -->
  <circle cx="100" cy="80" r="40" fill="none" stroke="#A54817" stroke-width="2" opacity="0.3" class="glow-effect"/>
</svg>
